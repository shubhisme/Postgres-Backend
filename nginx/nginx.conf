events{
}

http{
    upstream banking_backend{
        server host.docker.internal:3001 max_fails=3 fail_timeout=20s;
        server host.docker.internal:3002 max_fails=3 fail_timeout=20s;
        server host.docker.internal:3003 max_fails=3 fail_timeout=20s;
    }

    server {

        listen 80;

        location / {

            proxy_pass http://banking_backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}